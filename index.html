<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📈 AZIONARIO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@300;400;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--bg2:#f8f9fa;--bg3:#f1f3f5;
  --border:#dee2e6;--border2:#ced4da;
  --text:#212529;--text2:#495057;--text3:#868e96;
  --accent:#1971c2;
  --lc:#2f9e44;--le:#1971c2;--gr:#e67700;--ex:#c92a2a;--st:#862e2e;
  --font-mono:'Space Mono',monospace;
  --font-cond:'Barlow Condensed',sans-serif;
  --font-body:'Barlow',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:13px}

.topbar{background:var(--bg);border-bottom:2px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 20px;height:52px;position:sticky;top:0;z-index:100}
.logo{font-family:var(--font-cond);font-weight:800;font-size:22px;letter-spacing:3px;color:var(--accent)}
.logo span{color:var(--text3);font-weight:300}
.spacer{flex:1}
.meta{font-size:10px;color:var(--text3);font-family:var(--font-cond);letter-spacing:.5px}
.btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:5px 12px;border-radius:4px;font-size:11px;cursor:pointer;font-family:var(--font-cond);font-weight:700;letter-spacing:.5px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{opacity:.9;color:#fff}

.controls{display:flex;align-items:center;gap:8px;padding:8px 20px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.ctrl-label{font-size:10px;color:var(--text3);font-family:var(--font-cond);letter-spacing:.5px;font-weight:600}
select,input[type=text]{background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:4px 8px;border-radius:4px;font-size:11px;font-family:var(--font-body)}
select:focus,input:focus{outline:none;border-color:var(--accent)}
.count-badge{background:var(--accent);color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;font-family:var(--font-mono)}

.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);padding:0 20px;background:var(--bg)}
.tab{padding:10px 20px;font-family:var(--font-cond);font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--text3);transition:all .12s;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--text)}
.tab.act{color:var(--accent);border-bottom-color:var(--accent)}
.tab-cnt{background:var(--bg3);color:var(--text3);padding:1px 6px;border-radius:8px;font-size:9px;font-weight:700}
.tab.act .tab-cnt{background:var(--accent);color:#fff}

.table-wrap{overflow-x:auto;padding:0 20px 40px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:0}
thead th{position:sticky;top:0;background:var(--bg2);border-bottom:2px solid var(--border);padding:7px 8px;text-align:left;font-family:var(--font-cond);font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--text2);white-space:nowrap;cursor:pointer;user-select:none;z-index:10}
thead th:hover{color:var(--accent)}
thead th.sort-asc::after{content:' ↑'}
thead th.sort-desc::after{content:' ↓'}
tbody tr{border-bottom:1px solid var(--bg3);transition:background .08s}
tbody tr:hover{background:var(--bg2)}
tbody tr.hidden{display:none}
td{padding:6px 8px;vertical-align:middle;white-space:nowrap}
td.nome{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2);font-size:11px}
td.ticker{font-family:var(--font-mono);font-size:11px;font-weight:700;cursor:pointer;color:var(--accent)}
td.ticker:hover{text-decoration:underline}
td.num{font-family:var(--font-mono);font-size:11px;text-align:right}
td.score{font-family:var(--font-mono);font-size:12px;font-weight:700;text-align:right}

.pill{display:inline-block;padding:2px 7px;border-radius:3px;font-size:9px;font-weight:700;font-family:var(--font-cond);letter-spacing:.5px;white-space:nowrap}
.pill-lc{background:#d3f9d8;color:var(--lc)}
.pill-le{background:#dbe4ff;color:var(--le)}
.pill-gr{background:#fff3bf;color:var(--gr)}
.pill-ex{background:#ffe3e3;color:var(--ex)}
.pill-st{background:#ffe3e3;color:var(--st);border:1px solid #fca5a5}
.pill-hold{background:var(--bg3);color:var(--text3)}
.sbb-flag{color:#e67700;font-weight:700;font-size:10px;font-family:var(--font-cond)}

.rowbtn{background:none;border:1px solid var(--border2);color:var(--text3);padding:2px 6px;border-radius:3px;font-size:10px;cursor:pointer;margin-right:2px}
.rowbtn:hover{border-color:var(--accent);color:var(--accent)}

/* MODAL GRAFICO */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(33,37,41,.5);z-index:200;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
.modal-bg.open{display:flex}
.modal{background:var(--bg);border-radius:8px;max-width:920px;width:100%;padding:20px;position:relative}
.modal-close{position:absolute;top:12px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3)}
.modal-close:hover{color:var(--ex)}
.modal-header{display:flex;gap:20px;flex-wrap:wrap;align-items:baseline;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.modal-header h2{font-family:var(--font-cond);font-size:20px;letter-spacing:.5px}
.kv{font-family:var(--font-mono);font-size:12px}
.kv b{font-family:var(--font-cond);font-weight:700;color:var(--text3);font-size:10px;letter-spacing:.5px;margin-right:4px}
.kv.green{color:var(--lc)}.kv.red{color:var(--ex)}.kv.blue{color:var(--le)}.kv.orange{color:var(--gr)}
.chart-panel{margin:10px 0}
.chart-panel-title{font-family:var(--font-cond);font-size:10px;font-weight:700;letter-spacing:1px;color:var(--text3);margin-bottom:4px}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.loading{padding:40px;text-align:center;color:var(--text3);font-family:var(--font-cond)}

/* GRIGLIA INDICATORI (standard scannerv2) */
.modal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:14px 0}
.modal-stat{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:8px 10px}
.modal-stat .ms-label{font-family:var(--font-cond);font-size:9px;letter-spacing:1px;color:var(--text3);text-transform:uppercase;margin-bottom:3px}
.modal-stat .ms-val{font-family:var(--font-mono);font-size:14px;font-weight:700}
.green{color:var(--lc)}.red{color:var(--ex)}

/* REGIME DI MERCATO */
.regime-block{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:12px 14px;margin-bottom:14px}
.regime-block .rb-title{font-family:var(--font-cond);font-size:10px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:10px}
.regime-block .rb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rb-lbl{font-family:var(--font-cond);font-size:9px;letter-spacing:1px;color:var(--text3);text-transform:uppercase;margin-bottom:3px}
.rb-val{font-family:var(--font-mono);font-size:14px;font-weight:700}
.rb-bar{height:4px;background:var(--border);border-radius:2px;margin-top:3px;overflow:hidden}
.rb-bar-fill{height:100%;border-radius:2px}
.rb-sub{font-size:9px;color:var(--text3);margin-top:2px;font-family:var(--font-cond)}
.regime-badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:700;font-family:var(--font-cond);letter-spacing:.5px}
.regime-SLANCIO{background:#d3f9d8;color:#1a7f37;border:1px solid #8ce99a}
.regime-SALITA{background:#ebfbee;color:#2f9e44;border:1px solid #b2f2bb}
.regime-RIBASSO{background:#ffe3e3;color:#c92a2a;border:1px solid #ffa8a8}
.regime-TRANSIZIONE{background:#fff3bf;color:#7d4e00;border:1px solid #ffd43b}
.regime-LATERALE{background:#f1f3f5;color:#868e96;border:1px solid #dee2e6}

/* STORIA SEGNALI */
.history-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.history-table th{font-family:var(--font-cond);font-size:10px;letter-spacing:1px;color:var(--text3);text-transform:uppercase;padding:6px 10px;text-align:left;border-bottom:1px solid var(--border)}
.history-table td{padding:6px 10px;border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:11px}
.section-title{margin:16px 0 8px;font-family:var(--font-cond);font-size:11px;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase}

@media (max-width:700px){
  .modal{padding:14px}
  td,thead th{padding:5px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">AZIONARIO<span> · STOXX600 + S&amp;P500</span></div>
  <div class="spacer"></div>
  <div class="meta" id="lastUpdate">—</div>
  <button class="btn primary" id="btnExcel">⬇ Excel</button>
</div>

<div class="tabs">
  <div class="tab act" data-tab="EU">🇪🇺 Europa <span class="tab-cnt" id="cntEU">–</span></div>
  <div class="tab" data-tab="US">🇺🇸 USA <span class="tab-cnt" id="cntUS">–</span></div>
  <div class="tab" data-tab="IT">🇮🇹 Italia <span class="tab-cnt" id="cntIT">–</span></div>
</div>

<div class="controls">
  <span class="ctrl-label">Cerca</span>
  <input type="text" id="search" placeholder="nome o ticker...">
  <span class="ctrl-label">Settore</span>
  <select id="filterSettore"><option value="">Tutti</option></select>
  <span class="ctrl-label">Segnale</span>
  <select id="filterSegnale">
    <option value="">Tutti</option>
    <option value="BUY3">BUY3</option>
    <option value="BUY2">BUY2</option>
    <option value="HOLD">HOLD</option>
    <option value="SELL">SELL</option>
    <option value="STOP">STOP</option>
  </select>
  <label class="ctrl-label" style="display:flex;align-items:center;gap:4px;cursor:pointer">
    <input type="checkbox" id="filterSBB"> Solo Super Best Buy
  </label>
  <span class="spacer"></span>
  <span class="count-badge" id="rowCount">0</span>
</div>

<div class="table-wrap">
<table id="tbl">
  <thead>
    <tr>
      <th data-k="nome">Nome</th>
      <th data-k="ticker">Ticker</th>
      <th data-k="settore">Settore</th>
      <th data-k="prezzo">Prezzo</th>
      <th data-k="perf_oggi">Oggi%</th>
      <th data-k="perf_1m">Mese%</th>
      <th data-k="perf_6m">6M%</th>
      <th data-k="zona">Zona</th>
      <th data-k="segnale">Segnale</th>
      <th data-k="sar_bullish">SAR</th>
      <th data-k="rsi14">RSI14</th>
      <th data-k="adx">ADX</th>
      <th data-k="score">Score</th>
      <th>Azioni</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>

<!-- MODAL GRAFICO -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div id="modalContent"><div class="loading">Caricamento...</div></div>
  </div>
</div>

<script>
const DATA_URL = 'azionario.json';
const CHART_BASE = 'data/charts/';
let ALL = [];
let currentTab = 'EU';
let sortKey = 'score', sortDir = -1;

const zonaPill = z => ({
  LONG_CONF:'<span class="pill pill-lc">LONG CONF</span>',
  LONG_EARLY:'<span class="pill pill-le">LONG EARLY</span>',
  USCITA:'<span class="pill pill-gr">USCITA</span>',
  STOP:'<span class="pill pill-ex">STOP</span>',
  NEUTRA:'<span class="pill pill-hold">NEUTRA</span>',
}[z] || `<span class="pill pill-hold">${z}</span>`);

const segnalePill = s => ({
  BUY3:'<span class="pill pill-lc">BUY3</span>',
  BUY2:'<span class="pill pill-le">BUY2</span>',
  SELL:'<span class="pill pill-gr">SELL</span>',
  STOP:'<span class="pill pill-ex">STOP</span>',
  HOLD:'<span class="pill pill-hold">HOLD</span>',
}[s] || `<span class="pill pill-hold">${s}</span>`);

const pct = v => v==null ? '—' : `<span style="color:${v>=0?'var(--lc)':'var(--ex)'}">${v>=0?'+':''}${v.toFixed(2)}%</span>`;
const fileFor = t => t.replace(/\./g,'_').replace(/-/g,'_');

async function load(){
  const r = await fetch(DATA_URL + '?t=' + Date.now());
  const json = await r.json();
  ALL = json.titoli || [];
  document.getElementById('lastUpdate').textContent = 'Aggiornato: ' + (json.generato||'').replace('T',' ').slice(0,16);
  document.getElementById('cntEU').textContent = ALL.filter(x=>x.regione==='EU').length;
  document.getElementById('cntUS').textContent = ALL.filter(x=>x.regione==='US').length;
  document.getElementById('cntIT').textContent = ALL.filter(x=>x.regione==='IT').length;
  populateSettori();
  render();
}

function populateSettori(){
  const sel = document.getElementById('filterSettore');
  const settori = [...new Set(ALL.map(x=>x.settore))].sort();
  settori.forEach(s=>{
    const o = document.createElement('option');
    o.value = s; o.textContent = s;
    sel.appendChild(o);
  });
}

function currentRows(){
  let rows = ALL.filter(x=>x.regione===currentTab);
  const q = document.getElementById('search').value.trim().toLowerCase();
  if(q) rows = rows.filter(x=>x.nome.toLowerCase().includes(q) || x.ticker.toLowerCase().includes(q));
  const settore = document.getElementById('filterSettore').value;
  if(settore) rows = rows.filter(x=>x.settore===settore);
  const segnale = document.getElementById('filterSegnale').value;
  if(segnale) rows = rows.filter(x=>x.segnale===segnale);
  if(document.getElementById('filterSBB').checked) rows = rows.filter(x=>x.super_best_buy);
  rows.sort((a,b)=>{
    let va=a[sortKey], vb=b[sortKey];
    if(typeof va==='string') return sortDir*va.localeCompare(vb);
    return sortDir*((va??-Infinity)-(vb??-Infinity));
  });
  return rows;
}

function render(){
  const rows = currentRows();
  document.getElementById('rowCount').textContent = rows.length;
  const tb = document.getElementById('tbody');
  tb.innerHTML = rows.map(r=>`
    <tr>
      <td class="nome" title="${r.nome}">${r.nome}</td>
      <td class="ticker" onclick="openChart('${r.ticker}')">${r.ticker}${r.super_best_buy?' <span class="sbb-flag">🚀SBB</span>':''}</td>
      <td>${r.settore}</td>
      <td class="num">${r.prezzo?.toFixed(2)}</td>
      <td class="num">${pct(r.perf_oggi)}</td>
      <td class="num">${pct(r.perf_1m)}</td>
      <td class="num">${pct(r.perf_6m)}</td>
      <td>${zonaPill(r.zona)}</td>
      <td>${segnalePill(r.segnale)}</td>
      <td class="num" style="color:${r.sar_bullish?'var(--lc)':'var(--ex)'};font-weight:700" title="${r.bars_since_flip} barre dal flip">${r.sar_bullish?'▲':'▼'} ${r.bars_since_flip}</td>
      <td class="num">${r.rsi14?.toFixed(1)}</td>
      <td class="num">${r.adx?.toFixed(1)}</td>
      <td class="score">${r.score?.toFixed(0)}</td>
      <td>
        <button class="rowbtn" onclick="openChart('${r.ticker}')" title="Grafico">📈</button>
        <button class="rowbtn" onclick="openRegole('${r.ticker}')" title="Regole PDF">📄</button>
        <button class="rowbtn" onclick="window.open('https://www.tradingview.com/chart/?symbol=${encodeURIComponent(r.tv_symbol)}','_blank')" title="TradingView">TV</button>
      </td>
    </tr>`).join('');
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('act'));
  t.classList.add('act');
  currentTab = t.dataset.tab;
  render();
}));

['search','filterSettore','filterSegnale','filterSBB'].forEach(id=>{
  document.getElementById(id).addEventListener('input', render);
  document.getElementById(id).addEventListener('change', render);
});

document.querySelectorAll('thead th[data-k]').forEach(th=>{
  th.addEventListener('click', ()=>{
    const k = th.dataset.k;
    if(sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=-1; }
    document.querySelectorAll('thead th').forEach(x=>x.classList.remove('sort-asc','sort-desc'));
    th.classList.add(sortDir===1?'sort-asc':'sort-desc');
    render();
  });
});

function openRegole(ticker){
  window.open(`regole/${fileFor(ticker)}_Regole.html`, '_blank');
}

async function openChart(ticker){
  const bg = document.getElementById('modalBg');
  const content = document.getElementById('modalContent');
  bg.classList.add('open');
  content.innerHTML = '<div class="loading">Caricamento grafico...</div>';
  const row = ALL.find(x=>x.ticker===ticker);
  try{
    const chart = await fetch(CHART_BASE + fileFor(ticker) + '.json?t=' + Date.now()).then(r=>r.json());
    content.innerHTML = buildChartHTML(row, chart);
    renderChartSVG(chart);
  }catch(e){
    content.innerHTML = '<div class="loading">Dati grafico non disponibili per ' + ticker + '</div>';
  }
}

document.getElementById('modalClose').addEventListener('click', ()=>document.getElementById('modalBg').classList.remove('open'));
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') e.currentTarget.classList.remove('open'); });

const REGIME_LABEL = {
  SLANCIO:'🚀 Slancio', SALITA:'📈 Salita', RIBASSO:'📉 Ribasso',
  TRANSIZIONE:'⚠️ Transizione', LATERALE:'↔ Laterale'
};

function regimeBlockHTML(row){
  const reg = row.regime;
  if(!reg) return '';
  const h60 = row.hurst_60, h1y = row.hurst_1y, adxv = row.adx;
  const h60Col = h60>0.55?'var(--lc)':h60<0.45?'var(--le)':'var(--text3)';
  const h1yCol = h1y>0.55?'var(--lc)':h1y<0.45?'var(--le)':'var(--text3)';
  const adxCol = adxv>=25?'var(--lc)':adxv>=20?'var(--gr)':'var(--text3)';
  const indTxt = {
    SLANCIO:'Trend forte e confermato. BUY2/BUY3 favoriti.',
    SALITA:'Rialzo in corso. Seguire il trend.',
    RIBASSO:'Ribasso in corso. Cautela su nuovi ingressi.',
    TRANSIZIONE:'Zona grigia. Attendere conferma.',
    LATERALE:'Nessuna direzione. Segnali BUY più fragili.'
  }[reg.code] || '—';
  return `
  <div class="regime-block">
    <div class="rb-title">📊 Regime di Mercato</div>
    <div style="margin-bottom:8px">
      <span class="regime-badge regime-${reg.code}">${reg.label||REGIME_LABEL[reg.code]||reg.code}</span>
      <span style="font-size:11px;color:var(--text2);margin-left:10px">${indTxt}</span>
    </div>
    <div class="rb-grid">
      <div class="rb-cell">
        <div class="rb-lbl">Memoria recente (60g)</div>
        <div class="rb-val" style="color:${h60Col}">${h60!=null?h60.toFixed(3):'—'}</div>
        <div class="rb-bar"><div class="rb-bar-fill" style="width:${Math.round((h60??0.5)*100)}%;background:${h60Col}"></div></div>
        <div class="rb-sub">${h60>0.55?'tende a trendare':h60<0.45?'tende a rimbalzare':'neutro'}</div>
      </div>
      <div class="rb-cell">
        <div class="rb-lbl">Carattere annuale (1y)</div>
        <div class="rb-val" style="color:${h1yCol}">${h1y!=null?h1y.toFixed(3):'—'}</div>
        <div class="rb-bar"><div class="rb-bar-fill" style="width:${Math.round((h1y??0.5)*100)}%;background:${h1yCol}"></div></div>
        <div class="rb-sub">${h1y>0.55?'struttura trending':h1y<0.45?'struttura oscillante':'neutro'}</div>
      </div>
      <div class="rb-cell">
        <div class="rb-lbl">ADX(14) — forza attuale</div>
        <div class="rb-val" style="color:${adxCol}">${adxv!=null?adxv.toFixed(1):'—'}</div>
        <div class="rb-bar"><div class="rb-bar-fill" style="width:${Math.min(Math.round((adxv??0)/60*100),100)}%;background:${adxCol}"></div></div>
        <div class="rb-sub">${adxv>=25?'Forte':adxv>=20?'Transizione':'Debole'}</div>
      </div>
    </div>
  </div>`;
}

function indicatorGridHTML(row){
  const cell = (label, val, cls='') => `<div class="modal-stat"><div class="ms-label">${label}</div><div class="ms-val ${cls}">${val}</div></div>`;
  const pctCls = v => v>0?'green':v<0?'red':'';
  return `<div class="modal-grid">
    ${cell('Segnale', segnalePill(row.segnale))}
    ${cell('Rating', row.rating)}
    ${cell('Prezzo', row.prezzo.toFixed(2))}
    ${cell('Var% oggi', (row.perf_oggi>0?'+':'')+row.perf_oggi.toFixed(2)+'%', pctCls(row.perf_oggi))}
    ${cell('Score', row.score.toFixed(0)+'/100')}
    ${cell('ER', (row.er*100).toFixed(1)+'%')}
    ${cell('KAMA fast', row.kama_fast.toFixed(2))}
    ${cell('KAMA%', (row.kama_gap_pct>0?'+':'')+row.kama_gap_pct.toFixed(2)+'%', pctCls(row.kama_gap_pct))}
    ${cell('baff', row.baff)}
    ${cell('SAR', row.sar_bullish?'▲ BULL':'▼ BEAR', row.sar_bullish?'green':'red')}
    ${cell('AO', row.ao.toFixed(4), row.ao_improving?'green':'red')}
    ${cell('RVI', row.rvi>0?'BULL':'BEAR', row.rvi>0?'green':'red')}
    ${cell('RSI14', row.rsi14.toFixed(1), row.rsi14>70?'red':row.rsi14<30?'green':'')}
    ${cell('ADX', row.adx.toFixed(1))}
    ${cell('Mom 1M', row.perf_1m!=null?(row.perf_1m>0?'+':'')+row.perf_1m.toFixed(2)+'%':'—', pctCls(row.perf_1m))}
    ${cell('Mom 3M', row.perf_3m!=null?(row.perf_3m>0?'+':'')+row.perf_3m.toFixed(2)+'%':'—', pctCls(row.perf_3m))}
    ${cell('Mom 6M', row.perf_6m!=null?(row.perf_6m>0?'+':'')+row.perf_6m.toFixed(2)+'%':'—', pctCls(row.perf_6m))}
    ${cell('Segnale dal', row.segnale_dal||'—')}
    ${cell('Barre', row.segnale_bars!=null?row.segnale_bars+'gg':'—')}
    ${cell('Trend KAMA', row.kama_trend||'—', row.kama_trend==='VERDE'?'green':row.kama_trend==='ROSSO'?'red':'')}
  </div>`;
}

function historyTableHTML(chart){
  const n = chart.date.length;
  const rows = [];
  for(let i=n-1;i>=0 && rows.length<20;i--){
    if(i===n-1 || chart.signals[i]!==chart.signals[i+1]){
      rows.push(`<tr><td>${chart.date[i]}</td><td>${segnalePill(chart.signals[i])}</td><td>${chart.close[i]?.toFixed(2)}</td></tr>`);
    }
  }
  if(!rows.length) return '<div style="font-size:12px;color:var(--text3)">Nessuna history disponibile</div>';
  return `<table class="history-table"><thead><tr><th>Data</th><th>Segnale</th><th>Prezzo</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
}

// SMA semplice (standard raptor-geografia)
function sma(arr, period){
  const out = [];
  for(let i=0;i<arr.length;i++){
    if(i<period-1){ out.push(null); continue; }
    let s=0, ok=true;
    for(let k=i-period+1;k<=i;k++){ if(arr[k]==null){ ok=false; break; } s+=arr[k]; }
    out.push(ok ? s/period : null);
  }
  return out;
}

// Grafico completo (standard raptor-geografia): Heikin-Ashi + KAMA + MM20/50/100 + SAR
// + marker di entrata/uscita, Renko, Volume, Baffetti, AO, RSI(14/5) — reso via DOM in SVG.
function renderChartSVG(cd){
  const dates = cd.date || [];
  const N = dates.length;
  if(!N) return;
  const o = cd.open, h = cd.high, l = cd.low, c = cd.close, v = cd.volume;
  const kama = cd.kama_fast || [], ao = cd.ao || [], rsiArr = cd.rsi14 || [], rsi5Arr = cd.rsi5 || [];
  const sarArr = cd.sar || [], sarBull = cd.sar_bullish_series || (cd.sar||[]).map((s,i)=>c[i]>s);
  const bafC = cd.baff || [];
  const renko = cd.renko || [], renkoBrick = cd.renko_brick;
  const mm20 = sma(c,20), mm50 = sma(c,50), mm100 = sma(c,100);
  // marker di entrata/uscita derivati dai cambi di segnale (equivalente a signals_history)
  const sigHist = [];
  for(let i=0;i<N;i++){ if(i===0 || cd.signals[i]!==cd.signals[i-1]) sigHist.push({date:dates[i], signal:cd.signals[i]}); }

  function calcHA(o,h,l,c){
    const haO=[],haH=[],haL=[],haC=[];
    haO.push((o[0]+c[0])/2); haC.push((o[0]+h[0]+l[0]+c[0])/4);
    haH.push(Math.max(h[0],haO[0],haC[0])); haL.push(Math.min(l[0],haO[0],haC[0]));
    for(let i=1;i<c.length;i++){
      const nc=(o[i]+h[i]+l[i]+c[i])/4, no=(haO[i-1]+haC[i-1])/2;
      haO.push(no); haC.push(nc); haH.push(Math.max(h[i],no,nc)); haL.push(Math.min(l[i],no,nc));
    }
    return {haO,haH,haL,haC};
  }
  const ha = calcHA(o,h,l,c);

  const wrap = document.getElementById('chartSvgWrap');
  if(!wrap) return;
  const W = Math.max(wrap.clientWidth-2, 340);
  const PAD = {l:46,r:60,t:8,b:22};
  const PW = W - PAD.l - PAD.r;
  const panels = [{id:'price',h:230},{id:'renko',h:70},{id:'vol',h:50},{id:'baf',h:45},{id:'ao',h:60},{id:'rsi',h:80}];
  const GAP = 4;
  const totalH = panels.reduce((s,p)=>s+p.h+GAP,0) + PAD.t + PAD.b;

  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns,'svg');
  svg.setAttribute('width', W); svg.setAttribute('height', totalH);
  svg.setAttribute('viewBox', '0 0 '+W+' '+totalH);
  svg.style.cssText = 'display:block;background:#fff';

  function xPos(i,count){ count = count||N; return PAD.l + (i/Math.max(count-1,1))*PW; }
  function scY(val,mn,mx,yT,hh){ if(mx===mn) return yT+hh/2; return yT+hh-((val-mn)/(mx-mn))*hh; }
  function el(tag,attrs,par){ const e=document.createElementNS(ns,tag); for(const [k,vv] of Object.entries(attrs)) e.setAttribute(k,vv); (par||svg).appendChild(e); return e; }
  function line(x1,y1,x2,y2,stroke,sw,dash){ el('line',{x1:x1.toFixed(1),y1:y1.toFixed(1),x2:x2.toFixed(1),y2:y2.toFixed(1),stroke,'stroke-width':sw||1,...(dash?{'stroke-dasharray':dash}:{})}); }
  function polyline(pts,stroke,sw,dash){ if(pts.length<2) return; el('polyline',{points:pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '),stroke,'stroke-width':sw||1.5,fill:'none','stroke-linejoin':'round',...(dash?{'stroke-dasharray':dash}:{})}); }
  function rectEl(x,y,w2,h2,fill,op){ if(w2<=0||h2<=0) return; el('rect',{x:x.toFixed(1),y:y.toFixed(1),width:Math.max(0,w2).toFixed(1),height:Math.max(0,h2).toFixed(1),fill,opacity:op!=null?op:1}); }
  function txt(x,y,s,fill,size,anchor,weight){ const e=el('text',{x:x.toFixed(1),y:y.toFixed(1),fill,'font-size':size||9,'font-family':'Barlow Condensed,sans-serif','text-anchor':anchor||'middle','font-weight':weight||400}); e.textContent=s; }
  function tri(cx,cy,sz,up,fill){ const pts = up?`${cx},${cy-sz} ${cx-sz},${cy+sz} ${cx+sz},${cy+sz}`:`${cx},${cy+sz} ${cx-sz},${cy-sz} ${cx+sz},${cy-sz}`; el('polygon',{points:pts,fill}); }
  function diamond(cx,cy,sz,fill){ el('polygon',{points:`${cx},${cy-sz} ${cx+sz},${cy} ${cx},${cy+sz} ${cx-sz},${cy}`,fill}); }

  let yOff = PAD.t;
  panels.forEach(panel=>{
    const yTop = yOff, hh = panel.h;
    rectEl(PAD.l, yTop, PW, hh, '#fbfcfd');
    for(let g=0; g<=4; g++){ const gy = yTop+hh/4*g; line(PAD.l, gy, PAD.l+PW, gy, g===0||g===4?'#d0d7de':'#eef0f3', g===0||g===4?0.8:0.5); }

    if(panel.id==='price'){
      const allP = [...ha.haH, ...ha.haL, ...kama.filter(x=>x!=null), ...mm20.filter(x=>x!=null), ...mm100.filter(x=>x!=null)];
      const mn = Math.min(...allP)*0.995, mx = Math.max(...allP)*1.005;
      const sy = vv => scY(vv, mn, mx, yTop, hh);
      for(let g=0; g<=4; g++){ const vv = mn+(mx-mn)/4*g; txt(PAD.l-4, sy(vv)+3, vv<10?vv.toFixed(3):vv.toFixed(2), '#57606a', 8, 'end'); }
      const bw = Math.max(1, PW/N*0.6);
      for(let i=0;i<N;i++){
        const bull = ha.haC[i] >= ha.haO[i];
        const col = bull ? '#1a7f37' : '#cf222e';
        line(xPos(i), sy(ha.haH[i]), xPos(i), sy(ha.haL[i]), col, 1);
        const yb = sy(Math.max(ha.haO[i], ha.haC[i])), yb2 = sy(Math.min(ha.haO[i], ha.haC[i]));
        rectEl(xPos(i)-bw/2, yb, bw, Math.max(1, yb2-yb), col, 0.85);
      }
      polyline(mm100.map((vv,i)=>vv!=null?[xPos(i),sy(vv)]:null).filter(Boolean), '#bc8cff', 1, '8,4');
      polyline(mm50.map((vv,i)=>vv!=null?[xPos(i),sy(vv)]:null).filter(Boolean), '#e3b341', 1, '5,3');
      polyline(mm20.map((vv,i)=>vv!=null?[xPos(i),sy(vv)]:null).filter(Boolean), '#58a6ff', 1, '3,3');
      polyline(kama.map((vv,i)=>vv!=null?[xPos(i),sy(vv)]:null).filter(Boolean), '#f0883e', 2);
      sarArr.forEach((s,i)=>{ if(s==null) return; el('circle',{cx:xPos(i).toFixed(1),cy:sy(s).toFixed(1),r:2.6,fill:(c[i]>s)?'#6e40c9':'#f85149',stroke:'#fff','stroke-width':0.8}); });
      // Marker di entrata/uscita — standard raptor-geografia (STOP = stesso triangolo rosso di SELL)
      const segCol = { BUY3:'#6e40c9', BUY2:'#0969da', SELL:'#cf222e', STOP:'#cf222e' };
      sigHist.forEach(sh=>{
        const i = dates.indexOf(sh.date);
        if(i<0 || !segCol[sh.signal]) return;
        const up = sh.signal==='BUY3' || sh.signal==='BUY2';
        if(sh.signal==='BUY3') diamond(xPos(i), sy(c[i])+(up?12:-12), 5, segCol[sh.signal]);
        else tri(xPos(i), sy(c[i])+(up?12:-12), 5, up, segCol[sh.signal]);
      });
      const lc = c[N-1];
      rectEl(PAD.l+PW+2, sy(lc)-7, 50, 14, '#1f2328');
      txt(PAD.l+27+PW+0, sy(lc)+4, lc<10?lc.toFixed(4):lc.toFixed(2), '#fff', 8);
      txt(PAD.l+2, yTop+10, 'PREZZO (HEIKIN-ASHI) · KAMA · MM20/50/100 · SAR', '#57606a', 7.5, 'start', 700);
    }

    if(panel.id==='renko'){
      if(!renko || !renko.length){
        txt(PAD.l+PW/2, yTop+hh/2, 'Renko non disponibile per questo titolo', '#8b949e', 9);
      } else {
        const rn = renko.length;
        const vals = renko.flatMap(b=>[b.o,b.c]);
        const mn = Math.min(...vals), mx = Math.max(...vals);
        const sy = vv => scY(vv, mn, mx, yTop, hh);
        const bw = Math.max(2, PW/rn*0.8);
        renko.forEach((b,i)=>{
          const col = b.dir>0 ? '#1a7f37' : '#cf222e';
          const y0 = sy(Math.max(b.o,b.c)), y1 = sy(Math.min(b.o,b.c));
          rectEl(xPos(i,rn)-bw/2, y0, bw, Math.max(1, y1-y0), col, 0.9);
        });
      }
      txt(PAD.l+2, yTop+10, 'RENKO (ATR14, brick='+(renkoBrick||'—')+')', '#57606a', 7.5, 'start', 700);
    }

    if(panel.id==='vol'){
      const vmax = Math.max(...v, 1);
      const vAvg = sma(v, 20);
      const bw = Math.max(1, PW/N*0.7);
      v.forEach((vv,i)=>{
        const vh = (vv/vmax)*hh;
        const col = i===0 ? '#58a6ff' : c[i]>=c[i-1] ? 'rgba(26,127,55,.55)' : 'rgba(207,34,46,.55)';
        rectEl(xPos(i)-bw/2, yTop+hh-vh, bw, vh, col);
      });
      polyline(vAvg.map((vv,i)=>vv!=null?[xPos(i), yTop+hh-Math.min(vv/vmax,1)*hh]:null).filter(Boolean), '#0969da', 1.2);
      txt(PAD.l+2, yTop+10, 'VOLUME vs Media20', '#57606a', 7.5, 'start', 700);
    }

    if(panel.id==='baf'){
      const bmax = Math.max(5, ...bafC.map(Math.abs));
      const bw = Math.max(1, PW/N*0.7);
      bafC.forEach((n,i)=>{
        const bh = (Math.abs(n)/bmax)*hh;
        const col = n>=2 ? 'rgba(26,127,55,.85)' : n<=-2 ? 'rgba(207,34,46,.85)' : n>=1 ? 'rgba(240,136,62,.7)' : 'rgba(208,215,222,.6)';
        rectEl(xPos(i)-bw/2, yTop+hh-bh, bw, bh, col);
      });
      txt(PAD.l+2, yTop+10, 'BAFFETTI', '#57606a', 7.5, 'start', 700);
    }

    if(panel.id==='ao'){
      const vals = ao.filter(x=>x!=null);
      const mn = Math.min(...vals,0), mx = Math.max(...vals,0);
      const zero = scY(0,mn,mx,yTop,hh);
      const bw = Math.max(1, PW/N*0.7);
      line(PAD.l, zero, PAD.l+PW, zero, '#d0d7de', 1);
      ao.forEach((vv,i)=>{
        if(vv==null) return;
        const prev = ao[i-1];
        const up = vv >= (prev==null?vv:prev);
        const col = vv>=0 ? (up?'#1a7f37':'rgba(26,127,55,.4)') : (up?'rgba(207,34,46,.4)':'#cf222e');
        const y0 = scY(vv,mn,mx,yTop,hh);
        rectEl(xPos(i)-bw/2, Math.min(y0,zero), bw, Math.abs(y0-zero)||1, col);
      });
      txt(PAD.l+2, yTop+10, 'AO (Awesome Oscillator)', '#57606a', 7.5, 'start', 700);
    }

    if(panel.id==='rsi'){
      const sy = vv => scY(vv,0,100,yTop,hh);
      rectEl(PAD.l, sy(70), PW, sy(30)-sy(70), '#fff7e6', 0.7);
      [70,50,30].forEach(lv=>{ line(PAD.l, sy(lv), PAD.l+PW, sy(lv), lv===50?'#d0d7de':'#eef0f3', 0.8, lv!==50?'3,3':''); txt(PAD.l-4, sy(lv)+3, lv, '#57606a', 7.5, 'end'); });
      for(let i=1;i<N;i++){
        if(rsiArr[i]==null||rsiArr[i-1]==null||rsi5Arr[i]==null||rsi5Arr[i-1]==null) continue;
        const bullish = (rsi5Arr[i]+rsi5Arr[i-1]) >= (rsiArr[i]+rsiArr[i-1]);
        const col = bullish ? 'rgba(26,127,55,.18)' : 'rgba(207,34,46,.18)';
        const pts = `${xPos(i-1).toFixed(1)},${sy(rsiArr[i-1]).toFixed(1)} ${xPos(i).toFixed(1)},${sy(rsiArr[i]).toFixed(1)} ${xPos(i).toFixed(1)},${sy(rsi5Arr[i]).toFixed(1)} ${xPos(i-1).toFixed(1)},${sy(rsi5Arr[i-1]).toFixed(1)}`;
        el('polygon', {points:pts, fill:col});
      }
      polyline(rsiArr.map((vv,i)=>vv!=null?[xPos(i),sy(vv)]:null).filter(Boolean), '#e3b341', 1.5);
      polyline(rsi5Arr.map((vv,i)=>vv!=null?[xPos(i),sy(vv)]:null).filter(Boolean), '#58a6ff', 1.2, '3,2');
      const lr = rsiArr.filter(x=>x!=null).at(-1);
      if(lr!=null){ rectEl(PAD.l+PW+2, sy(lr)-6, 32, 12, '#e3b341'); txt(PAD.l+18+PW, sy(lr)+4, lr.toFixed(0), '#1f2328', 8); }
      txt(PAD.l+2, yTop+10, 'RSI(14) arancio · RSI(5) blu tratteggiato', '#57606a', 7.5, 'start', 700);
      const step = Math.max(1, Math.floor(N/8));
      for(let i=0;i<N;i+=step){
        const dd = new Date(dates[i]);
        txt(xPos(i), totalH-PAD.b+13, dd.getDate()+'/'+(dd.getMonth()+1), '#57606a', 7.5);
      }
    }

    yOff += hh + GAP;
  });

  wrap.innerHTML = '';
  wrap.appendChild(svg);

  const legEl = document.getElementById('chartLegend');
  if(legEl){
    const swf = (color,label) => `<span style="display:inline-flex;align-items:center;gap:4px"><span style="width:10px;height:10px;background:${color};display:inline-block;border-radius:2px"></span>${label}</span>`;
    legEl.innerHTML = [swf('#1a7f37','HA Verde'), swf('#cf222e','HA Rosso'), swf('#f0883e','KAMA'), swf('#58a6ff','MM20'), swf('#e3b341','MM50'), swf('#bc8cff','MM100'),
      swf('#0969da','BUY2'), swf('#6e40c9','BUY3'), swf('#cf222e','SELL/STOP')].join('');
  }
}

    Zona:r.zona, Segnale:r.segnale, Rating:r.rating, Score:r.score,
